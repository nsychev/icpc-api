[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "icpc-api"
dynamic = ["version"]
description = "Unofficial Python client and CLI for the icpc.global API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Nikita Sychev", email = "root@nsychev.ru" }]
keywords = ["icpc", "api", "client", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28", "pydantic>=2.9"]

[project.urls]
Homepage = "https://github.com/nsychev/icpc-api"
Repository = "https://github.com/nsychev/icpc-api"
Issues = "https://github.com/nsychev/icpc-api/issues"
Documentation = "https://github.com/nsychev/icpc-api/tree/master/docs"

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13"]

[project.scripts]
icpc = "icpc.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "hypothesis>=6",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[tool.setuptools.dynamic]
version = { attr = "icpc.__version__" }

[tool.ruff]
src = ["."]
line-length = 100
target-version = "py312"
# `docs/` is prose; its fenced examples are formatted for reading, not by ruff.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20",
    "SIM", "RUF", "ANN", "ASYNC", "S", "PTH", "PL",
]
ignore = ["ANN401", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# The exceptions are deliberately named after HTTP statuses, and the transport
# compares against those statuses by number: a `HTTP_NOT_FOUND = 404` constant
# would be less readable, not more.
"icpc/errors.py" = ["N818"]
"icpc/transport/_shared.py" = ["PLR2004"]
"icpc/transport/async_client.py" = ["PLR2004"]
"icpc/transport/sync_client.py" = ["PLR2004"]
# Cognito challenge names and the store's JSON key names are not credentials.
"icpc/auth/cognito.py" = ["S105"]
"icpc/auth/store.py" = ["S105"]
# Test tokens are fixtures, not secrets, and local imports keep a test readable.
"tests/*" = ["S101", "S105", "S106", "ANN", "PLR2004", "PLR0917", "S610", "C420", "PLC0415"]
# The reference SRP implementation is reproduced verbatim; modernising it would
# defeat the point of comparing against it.
"tests/unit/test_srp.py" = ["UP031", "PLC0415"]
# typer builds a command's signature from its parameters; the count is the UI.
"icpc/cli/*" = ["T20", "B008", "PLR0917"]
# The examples are scripts: printing is their whole interface, and they are read
# as much as run, so a `main()` that tells its own story beats one split for a
# statement count.
"examples/*" = ["T20", "PLR0912", "PLR0915"]
"icpc/auth/srp.py" = ["N803", "N806", "PLR2004", "S101"]
# Matched by suffix so the generator can lint a temporary copy in --check mode.
"**/_generated.py" = ["E501", "RUF012"]

[tool.ty.environment]
python-version = "3.12"
root = ["."]

# ty can't check types against inline dependencies in the examples
[tool.ty.src]
exclude = ["examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
